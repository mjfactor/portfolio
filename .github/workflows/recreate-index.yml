name: Recreate Azure AI Search Index

on:
  push:
    branches:
      - main

jobs:
  recreate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Wait for Vercel deployment
        run: |
          echo "📦 Installing Vercel CLI..."
          npm install -g vercel@latest
          
          echo "⏳ Waiting for Vercel deployment to complete..."
          timeout=300  # 5 minutes timeout
          interval=10  # Check every 10 seconds
          elapsed=0
          
          while [ $elapsed -lt $timeout ]; do
            echo "🔍 Checking deployment status..."
            
            # Get the latest deployment for this commit
            deployment_status=$(vercel ls --token ${{ secrets.VERCEL_TOKEN }} --format json | jq -r '.[0].state' 2>/dev/null || echo "UNKNOWN")
            
            if [ "$deployment_status" = "READY" ]; then
              echo "✅ Vercel deployment is ready!"
              echo "⏳ Waiting additional 30 seconds for CDN propagation..."
              sleep 30
              break
            elif [ "$deployment_status" = "ERROR" ]; then
              echo "❌ Vercel deployment failed"
              exit 1
            else
              echo "⏳ Deployment status: $deployment_status - waiting ${interval} seconds... (${elapsed}/${timeout}s elapsed)"
              sleep $interval
              elapsed=$((elapsed + interval))
            fi
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "❌ Timeout waiting for Vercel deployment"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Run recreateIndex script
        run: pnpm tsx lib/rag/runRecreateIndex.ts
        env:
          AZURE_AISEARCH_ENDPOINT: ${{ secrets.AZURE_AISEARCH_ENDPOINT }}
          AZURE_AISEARCH_KEY: ${{ secrets.AZURE_AISEARCH_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
